name: Internal VM source closure

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Record pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/src bundle/receipts
          cat > bundle/receipts/PINS.txt <<'EOF'
          yt-dlp/yt-dlp 3a08beaf031ab68f966401ead017ac81fe8486cf Release 2026.08.19
          paperfoot/suno-cli f0dea4d4e0ef998a508e73f05749eb2b138a253d upstream v0.9 tree
          FreesoSaiFared/suno-cli f7a029e24be7fd027870b8771556d2b60dd2aeac upload fusion
          EOF

      - name: Retrieve pinned GitHub sources through gh-proxy
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            local name="$1" url="$2"
            echo "fetching $name"
            curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
              "https://gh-proxy.com/${url}" -o "bundle/${name}.tar.gz"
            sha256sum "bundle/${name}.tar.gz" | tee -a bundle/receipts/SHA256SUMS
          }
          fetch yt-dlp-3a08beaf https://github.com/yt-dlp/yt-dlp/archive/3a08beaf031ab68f966401ead017ac81fe8486cf.tar.gz
          fetch paperfoot-suno-cli-f0dea4d4 https://github.com/paperfoot/suno-cli/archive/f0dea4d4e0ef998a508e73f05749eb2b138a253d.tar.gz
          fetch freeso-suno-cli-f7a029e2 https://github.com/FreesoSaiFared/suno-cli/archive/f7a029e24be7fd027870b8771556d2b60dd2aeac.tar.gz

          tar -xzf bundle/yt-dlp-3a08beaf.tar.gz -C bundle/src
          tar -xzf bundle/paperfoot-suno-cli-f0dea4d4.tar.gz -C bundle/src
          tar -xzf bundle/freeso-suno-cli-f7a029e2.tar.gz -C bundle/src
          mv bundle/src/yt-dlp-* bundle/src/yt-dlp
          mv bundle/src/suno-cli-f0dea4d4e0ef998a508e73f05749eb2b138a253d bundle/src/suno-cli-upstream
          mv bundle/src/suno-cli-f7a029e24be7fd027870b8771556d2b60dd2aeac bundle/src/suno-cli-freeso

      - name: Prove yt-dlp source snapshot
        shell: bash
        working-directory: bundle/src/yt-dlp
        run: |
          set -euo pipefail
          python --version | tee ../../receipts/python-version.txt
          python -m compileall -q yt_dlp
          PYTHONPATH=. python -m yt_dlp --version | tee ../../receipts/yt-dlp-version.txt

      - name: Prove Freeso suno-cli upload wiring and tests
        shell: bash
        working-directory: bundle/src/suno-cli-freeso
        run: |
          set -euo pipefail
          rustc --version --verbose | tee ../../receipts/rustc-version.txt
          cargo --version | tee ../../receipts/cargo-version.txt
          cargo fmt --all -- --check
          cargo test --all-targets 2>&1 | tee ../../receipts/cargo-test.txt
          cargo clippy --all-targets -- -D warnings 2>&1 | tee ../../receipts/cargo-clippy.txt

          cargo run --quiet -- upload --help > ../../receipts/suno-upload-help.txt
          cargo run --quiet -- init-clip --help > ../../receipts/suno-init-clip-help.txt
          cargo run --quiet -- agent-info > ../../receipts/suno-agent-info.json

          grep -nE 'upload_audio_init|upload_audio_to_s3|upload_audio_finish|upload_audio_status|initialize_clip|/api/uploads/audio/' \
            src/api/upload.rs | tee ../../receipts/upload-api-wiring.txt
          grep -nE 'Commands::Upload|Commands::InitClip|Upload\(|InitClip\(' \
            src/main.rs src/cli.rs | tee ../../receipts/upload-cli-wiring.txt

      - name: Vendor Rust dependencies for offline VM development
        shell: bash
        working-directory: bundle/src/suno-cli-freeso
        run: |
          set -euo pipefail
          mkdir -p .cargo
          cargo vendor vendor > .cargo/config.toml
          cargo metadata --offline --format-version 1 --no-deps > ../../receipts/cargo-metadata-offline.json

      - name: Package portable Rust sysroot
        shell: bash
        run: |
          set -euo pipefail
          SYSROOT="$(rustc --print sysroot)"
          echo "$SYSROOT" > bundle/receipts/rust-sysroot-source.txt
          tar -C "$(dirname "$SYSROOT")" -I 'zstd -T0 -8' \
            -cf bundle/rust-toolchain-x86_64-linux.tar.zst "$(basename "$SYSROOT")"
          sha256sum bundle/rust-toolchain-x86_64-linux.tar.zst >> bundle/receipts/SHA256SUMS

      - name: Write VM activation recipe
        shell: bash
        run: |
          set -euo pipefail
          cat > bundle/VM_ACTIVATE.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="${1:-/opt/dev/suno-workbench}"
          mkdir -p "$ROOT"
          cp -a src/. "$ROOT/"
          mkdir -p "$ROOT/rust-toolchain"
          tar --zstd -xf rust-toolchain-x86_64-linux.tar.zst -C "$ROOT/rust-toolchain" --strip-components=1
          cat > "$ROOT/env.sh" <<ENV
          export PATH="$ROOT/rust-toolchain/bin:\$PATH"
          export CARGO_NET_OFFLINE=true
          export SUNO_CONFIG_DIR="$ROOT/.state/config"
          export SUNO_DATA_DIR="$ROOT/.state/data"
          ENV
          mkdir -p "$ROOT/.state/config" "$ROOT/.state/data"
          echo "source $ROOT/env.sh"
          EOF
          chmod +x bundle/VM_ACTIVATE.sh

      - name: Upload offline development closure
        uses: actions/upload-artifact@v4
        with:
          name: internal-vm-dev-closure
          path: bundle/
          compression-level: 3
          retention-days: 7
          if-no-files-found: error
