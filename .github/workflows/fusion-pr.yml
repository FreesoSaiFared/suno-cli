name: Selective fusion transformer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  transform:
    if: github.head_ref == 'fusion/iinlanjian-features'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fusion/iinlanjian-features
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply deterministic selective fusion
        run: python scripts/fusion_apply.py
      - name: Validate transformed tree
        run: |
          cargo fmt --all
          cargo check --all-targets
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Commit validated source and remove temporary machinery
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/fusion-apply.yml .github/workflows/fusion-apply-v2.yml .github/workflows/fusion-pr.yml .fusion-trigger .fusion-trigger2 scripts/fusion_apply.py || true
          git add src/cli.rs src/main.rs Cargo.lock
          git commit -m "feat: wire upload, init-clip, and enhanced cover controls"
          git push origin HEAD:fusion/iinlanjian-features
